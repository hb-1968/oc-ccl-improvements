[project]
name = "occl"
version = "0.1.0"
description = "Paper-faithful SST/SAM-2 reproduction harness and OC-CCL improvements"
requires-python = ">=3.10"

# Kept deliberately torch-free: the metric, seeding, dataset manifests, registry and
# gate checks all run locally on a machine with no GPU. Torch lives in the `gpu` extra,
# installed only in Colab.
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.5",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "iopath>=0.1.9",
    "pillow>=10",
    "tqdm>=4.65",
    "requests>=2.31",
]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/occl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
